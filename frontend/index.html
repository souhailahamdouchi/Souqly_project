<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SOUQLY — La marketplace des commerçants marocains. Achetez et vendez en toute simplicité."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Thème appliqué avant le premier rendu pour éviter le flash clair→sombre
      try {
        if (localStorage.getItem('souqly-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.setProperty('color-scheme', 'dark');
        }
      } catch (e) {
        /* localStorage indisponible : thème clair par défaut */
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SOUQLY - Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
